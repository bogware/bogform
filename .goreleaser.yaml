project_name: bogform

before:
  hooks:
    - sh -c "cd web && npm ci --no-audit --no-fund && npm run build"
    - go mod tidy
    - go generate ./...
    - make protobuf

builds:
  - id: bogform
    binary: bogform
    env:
      - CGO_ENABLED=0

    main: ./cmd/bogform

    flags:
      - "-mod=readonly"
      - "-trimpath"

    ldflags:
      - "-s -w"
      - "-X 'github.com/bogware/bogform/version.dev=no'"
      # BUILD_BOGFORM_OFFICIAL is set by the project's release workflow. Leave it unset
      # for third-party builds, such as Linux distribution packages.
      - "-X 'github.com/bogware/bogform/version.officialBuild={{if index .Env \"BUILD_BOGFORM_OFFICIAL\" }}{{ .Env.BUILD_BOGFORM_OFFICIAL }}{{end}}'"

    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - solaris

    goarch:
      - amd64
      - arm64

    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: openbsd
        goarch: arm64
      - goos: solaris
        goarch: arm64

  - id: bogform-server
    binary: bootstrap
    env:
      - CGO_ENABLED=0
    main: ./cmd/bogform-server
    flags:
      - "-mod=readonly"
      - "-trimpath"
    ldflags:
      - "-s -w"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    id: targz
    builds: [bogform]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{- .Os }}_{{- .Arch }}"

  - format: zip
    id: zip
    builds: [bogform]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{- .Os }}_{{- .Arch }}"

  # What the deployment module in deploy/aws reads: the server as "bootstrap", and the UI in "ui".
  - format: tar.gz
    id: server
    builds: [bogform-server]
    name_template: "bogform-server_{{ .Version }}_{{- .Os }}_{{- .Arch }}"
    files:
      - src: web/dist/**
        dst: ui
        strip_parent: true

dockers:
  - use: buildx
    ids: [bogform]
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Bogware"
      - "--label=org.opencontainers.image.description=Bogform {{ .Version }}"
      - "--label=org.opencontainers.image.url=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.documentation=https://github.com/bogware/bogform/blob/main/README.md"
      - "--label=org.opencontainers.image.source=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.licenses=MPL-2.0"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z07:00\" }}"
    image_templates:
      - "ghcr.io/bogware/bogform:{{ .Version }}-amd64"

  - use: buildx
    ids: [bogform]
    goarch: amd64
    dockerfile: Dockerfile.minimal
    build_flag_templates:
      - "--pull"
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Bogware"
      - "--label=org.opencontainers.image.description=Bogform {{ .Version }}"
      - "--label=org.opencontainers.image.url=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.documentation=https://github.com/bogware/bogform/blob/main/README.md"
      - "--label=org.opencontainers.image.source=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.licenses=MPL-2.0"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z07:00\" }}"
    image_templates:
      - "ghcr.io/bogware/bogform:{{ .Version }}-minimal-amd64"

  - use: buildx
    ids: [bogform]
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Bogware"
      - "--label=org.opencontainers.image.description=Bogform {{ .Version }}"
      - "--label=org.opencontainers.image.url=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.documentation=https://github.com/bogware/bogform/blob/main/README.md"
      - "--label=org.opencontainers.image.source=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.licenses=MPL-2.0"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z07:00\" }}"
    image_templates:
      - "ghcr.io/bogware/bogform:{{ .Version }}-arm64"

  - use: buildx
    ids: [bogform]
    goarch: arm64
    dockerfile: Dockerfile.minimal
    build_flag_templates:
      - "--pull"
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.vendor=Bogware"
      - "--label=org.opencontainers.image.description=Bogform {{ .Version }}"
      - "--label=org.opencontainers.image.url=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.documentation=https://github.com/bogware/bogform/blob/main/README.md"
      - "--label=org.opencontainers.image.source=https://github.com/bogware/bogform"
      - "--label=org.opencontainers.image.licenses=MPL-2.0"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ time \"2006-01-02T15:04:05Z07:00\" }}"
    image_templates:
      - "ghcr.io/bogware/bogform:{{ .Version }}-minimal-arm64"

docker_manifests:
  - name_template: ghcr.io/bogware/bogform:{{ .Version }}
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-arm64

  - name_template: ghcr.io/bogware/bogform:{{ .Version }}-minimal
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-arm64

  - name_template: ghcr.io/bogware/bogform:{{ .Major }}.{{ .Minor }}
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-arm64
    skip_push: auto # Skips the push on pre-release versions, like 1.6.1-alpha1. See https://goreleaser.com/customization/docker_manifest/#customization

  - name_template: ghcr.io/bogware/bogform:{{ .Major }}.{{ .Minor }}-minimal
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-arm64
    skip_push: auto # Skips the push on pre-release versions, like 1.6.1-alpha1. See https://goreleaser.com/customization/docker_manifest/#customization

  - name_template: ghcr.io/bogware/bogform:{{ .Major }}
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-arm64
    skip_push: auto # Skips the push on pre-release versions, like 1.6.1-alpha1. See https://goreleaser.com/customization/docker_manifest/#customization

  - name_template: ghcr.io/bogware/bogform:{{ .Major }}-minimal
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-arm64
    skip_push: auto # Skips the push on pre-release versions, like 1.6.1-alpha1. See https://goreleaser.com/customization/docker_manifest/#customization

  - name_template: ghcr.io/bogware/bogform:latest
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-arm64
    skip_push: auto # Skips the push on pre-release versions, like 1.6.1-alpha1. See https://goreleaser.com/customization/docker_manifest/#customization

  - name_template: ghcr.io/bogware/bogform:minimal
    image_templates:
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-amd64
      - ghcr.io/bogware/bogform:{{ .Version }}-minimal-arm64
    skip_push: auto # Skips the push on pre-release versions, like 1.6.1-alpha1. See https://goreleaser.com/customization/docker_manifest/#customization

nfpms:
  - builds: [bogform]
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}'
    maintainer: 'Bogform maintainers <https://github.com/bogware/bogform>'
    homepage: https://github.com/bogware/bogform
    description: >-
      Bogform lets you declaratively manage your cloud infrastructure.
    license: "MPL-2.0"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: default
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/bogform/copyright
        file_info:
          mode: 0444

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

signs:
  - artifacts: all
    id: cosign
    cmd: cosign
    certificate: "${artifact}.pem"
    args: [ "sign-blob", "--oidc-issuer=https://token.actions.githubusercontent.com", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", "--yes" ]

docker_signs:
  - artifacts: all
    args: [ "sign", "--oidc-issuer=https://token.actions.githubusercontent.com", "${artifact}@${digest}", "--yes" ]

snapshot:
  name_template: "{{ .Version }}-next"

changelog:
  use: github-native

release:
  prerelease: auto
  draft: true
