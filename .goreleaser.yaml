version: 2

project_name: bogform

before:
  hooks:
    - sh -c "cd web && npm ci --no-audit --no-fund && npm run build && rm -rf ../ui && cp -r dist ../ui"
    - go mod tidy
    - go generate ./...
    - make protobuf

builds:
  - id: bogform
    binary: bogform
    env:
      - CGO_ENABLED=0

    main: ./cmd/bogform

    flags:
      - "-mod=readonly"
      - "-trimpath"

    ldflags:
      - "-s -w"
      - "-X 'github.com/bogware/bogform/version.dev=no'"
      # BUILD_BOGFORM_OFFICIAL is set by the project's release workflow. Leave it unset
      # for third-party builds, such as Linux distribution packages.
      - "-X 'github.com/bogware/bogform/version.officialBuild={{if index .Env \"BUILD_BOGFORM_OFFICIAL\" }}{{ .Env.BUILD_BOGFORM_OFFICIAL }}{{end}}'"

    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - solaris

    goarch:
      - amd64
      - arm64

    ignore:
      - goos: freebsd
        goarch: arm64
      - goos: openbsd
        goarch: arm64
      - goos: solaris
        goarch: arm64

  - id: bogform-server
    binary: bootstrap
    env:
      - CGO_ENABLED=0
    main: ./cmd/bogform-server
    flags:
      - "-mod=readonly"
      - "-trimpath"
    ldflags:
      - "-s -w"
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    id: targz
    ids: [bogform]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{- .Os }}_{{- .Arch }}"

  - formats: [zip]
    id: zip
    ids: [bogform]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{- .Os }}_{{- .Arch }}"

  # What the deployment module in deploy/aws reads: the server as "bootstrap", and the UI in "ui".
  - formats: [tar.gz]
    id: server
    ids: [bogform-server]
    name_template: "bogform-server_{{ .Version }}_{{- .Os }}_{{- .Arch }}"
    files:
      - ui/**

# Multi-platform images, built and pushed with buildx. Prereleases get only their exact version tag.
dockers_v2:
  - id: standard
    ids: [bogform]
    dockerfile: Dockerfile
    images: [ghcr.io/bogware/bogform]
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.vendor: Bogware
      org.opencontainers.image.description: "Bogform {{ .Version }}"
      org.opencontainers.image.url: https://github.com/bogware/bogform
      org.opencontainers.image.documentation: https://github.com/bogware/bogform/blob/main/README.md
      org.opencontainers.image.source: https://github.com/bogware/bogform
      org.opencontainers.image.licenses: MPL-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

  - id: minimal
    ids: [bogform]
    dockerfile: Dockerfile.minimal
    images: [ghcr.io/bogware/bogform]
    tags:
      - "{{ .Version }}-minimal"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}-minimal{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}-minimal{{ end }}"
      - "{{ if not .Prerelease }}minimal{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.vendor: Bogware
      org.opencontainers.image.description: "Bogform {{ .Version }}"
      org.opencontainers.image.url: https://github.com/bogware/bogform
      org.opencontainers.image.documentation: https://github.com/bogware/bogform/blob/main/README.md
      org.opencontainers.image.source: https://github.com/bogware/bogform
      org.opencontainers.image.licenses: MPL-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"

nfpms:
  - ids: [bogform]
    file_name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}'
    maintainer: 'Bogform maintainers <https://github.com/bogware/bogform>'
    homepage: https://github.com/bogware/bogform
    description: >-
      Bogform lets you declaratively manage your cloud infrastructure.
    license: "MPL-2.0"
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: default
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/bogform/copyright
        file_info:
          mode: 0444

# An SPDX SBOM for each archive, made with Syft.
sboms:
  - artifacts: archive

# Package managers. Each repository is written with its own deploy key, and prereleases are skipped.
homebrew_casks:
  - name: bogform
    ids: [targz]
    binaries: [bogform]
    homepage: https://github.com/bogware/bogform
    description: Manage cloud infrastructure from your repository, without a hosted platform.
    directory: Casks
    skip_upload: auto
    commit_msg_template: "Update Bogform to {{ .Tag }}"
    commit_author:
      name: Bogform release
      email: bogform-release@users.noreply.github.com
    # The binaries aren't notarized by Apple, so macOS would otherwise refuse to run them. The
    # release's checksums and cosign signatures are the way to verify them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bogform"]
          end
    repository:
      owner: bogware
      name: homebrew-tap
      branch: main
      git:
        url: "git@github.com:bogware/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY }}"

scoops:
  - name: bogform
    ids: [zip]
    homepage: https://github.com/bogware/bogform
    description: Manage cloud infrastructure from your repository, without a hosted platform.
    license: MPL-2.0
    directory: bucket
    skip_upload: auto
    commit_msg_template: "Update Bogform to {{ .Tag }}"
    commit_author:
      name: Bogform release
      email: bogform-release@users.noreply.github.com
    repository:
      owner: bogware
      name: scoop-bucket
      branch: main
      git:
        url: "git@github.com:bogware/scoop-bucket.git"
        private_key: "{{ .Env.SCOOP_BUCKET_SSH_KEY }}"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"

signs:
  - artifacts: all
    id: cosign
    cmd: cosign
    certificate: "${artifact}.pem"
    args: [ "sign-blob", "--oidc-issuer=https://token.actions.githubusercontent.com", "--output-certificate=${certificate}", "--output-signature=${signature}", "${artifact}", "--yes" ]

docker_signs:
  - artifacts: all
    args: [ "sign", "--oidc-issuer=https://token.actions.githubusercontent.com", "${artifact}@${digest}", "--yes" ]

snapshot:
  version_template: "{{ .Version }}-next"

changelog:
  use: github-native

release:
  prerelease: auto
  draft: true
