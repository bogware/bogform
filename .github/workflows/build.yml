name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'v[0-9]+.[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - {goos: "freebsd", goarch: "amd64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "linux", goarch: "amd64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "linux", goarch: "arm64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "openbsd", goarch: "amd64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "solaris", goarch: "amd64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "windows", goarch: "amd64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "windows", goarch: "arm64", runson: "ubuntu-latest", cgo-enabled: "0"}
          - {goos: "darwin", goarch: "amd64", runson: "macos-latest", cgo-enabled: "1"}
          - {goos: "darwin", goarch: "arm64", runson: "macos-latest", cgo-enabled: "1"}
      fail-fast: false

    name: Build for ${{ matrix.goos }}_${{ matrix.goarch }}
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: "Fetch source code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Configure Go toolchain"
        uses: ./.github/actions/go-toolchain

      - name: "Build bogform executable"
        run: |
          go build ./cmd/bogform

  e2e-tests:
    strategy:
      matrix:
        # GitHub bills macOS and Windows minutes at higher rates, so run them for releases and on demand.
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) && '[{"runson":"ubuntu-latest","goos":"linux","goarch":"amd64"},{"runson":"macos-latest","goos":"darwin","goarch":"amd64"},{"runson":"windows-latest","goos":"windows","goarch":"amd64"}]' || '[{"runson":"ubuntu-latest","goos":"linux","goarch":"amd64"}]') }}
      fail-fast: false

    name: "End-to-end Tests for ${{ matrix.goos }}_${{ matrix.goarch }}"
    runs-on: ${{ matrix.runson }}
    env:
      TF_APPEND_USER_AGENT: E2E-Test
      TF_ACC: 1
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: "Fetch source code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Configure Go toolchain"
        uses: ./.github/actions/go-toolchain

      - name: "End-to-end tests"
        run: |
          go test -v ./internal/command/e2etest
