# Reports known vulnerabilities in the code that the bogform binary actually calls.
# Bogform is a hard fork and doesn't receive upstream fixes automatically, so run this
# by hand periodically as well as on pull requests that change dependencies.

name: Govulncheck

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@617f44b718537dccdea1915395650e0529e3b72e # v1.7.0

      - name: Run govulncheck
        run: govulncheck ./cmd/bogform
